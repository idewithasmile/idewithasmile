name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: idewithasmile
          template: classic
          
          # Bỏ 'header' để About me lên đỉnh cột trái
          base: activity, community, repositories, metadata
          config_display: columns
          config_timezone: Asia/Saigon

          # Ngăn SVG tự bẻ thành 1 cột khi khung README hẹp hơn 900px
          extras_css: |
            .row.columns {
              flex-direction: row !important;
              flex-wrap: nowrap !important;
            }

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_stars: yes
          plugin_stars_limit: 1

          # Xuất ra file github-metrics.svg và commit
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics visual [skip ci]"

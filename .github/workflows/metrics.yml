name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: idewithasmile

          # Giao diện chia 2 cột & Múi giờ
          template: classic
          config_display: columns
          config_timezone: Asia/Saigon
          # Tăng padding dưới để tránh bị cắt xén mép đáy
          config_padding: 0, 6%

          # Thứ tự phân bổ chuẩn vào 2 cột (Cột 1: Trái, Cột 2: Phải)
          config_order: introduction, base.activity+community, base.repositories, languages, isocalendar, stars

          # BỎ 'header' để About me lên góc trên cùng bên trái
          base: activity, community, repositories, metadata
          base_indepth: false
          base_hireable: false
          base_skip: false

          # Cột trái 1: Giới thiệu (About me)
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Cột trái 2: Ngôn ngữ lập trình
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: false
          plugin_languages_indepth: false
          plugin_languages_categories: markup, programming
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

          # Cột phải 1: Lịch đóng góp 3D (Contributions calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Cột phải 2: Repo đã Star gần nhất (Recently starred)
          plugin_stars: yes
          plugin_stars_limit: 1

          # Tự động commit vào repository
          output_action: commit
          committer_branch: main
          committer_message: "chore: update profile metrics visual [skip ci]"

name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: idewithasmile

          # Cấu hình Layout 2 cột & kích thước
          template: classic
          config_display: columns
          config_timezone: Asia/Saigon
          config_padding: 0, 5%

          # Base metadata
          base: header, activity, community, repositories, metadata
          base_indepth: false
          base_hireable: false
          base_skip: false

          # Plugin: Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Plugin: Isocalendar (Nếu để full-year bị quá dài/khuất, đổi duration sang half-year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Plugin: Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: false
          plugin_languages_indepth: false
          plugin_languages_categories: markup, programming
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

          # Plugin: Stars
          plugin_stars: yes
          plugin_stars_limit: 1

          # Commit file
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github-metrics.svg [skip ci]"
